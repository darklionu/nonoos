name: testec

on:
  push:
    branches: [main]
    paths:
      - "rootfs/**"
      - ".github/workflows/di.yml"
  pull_request:
    branches: [main]
    paths:
      - "rootfs/**"
      - ".github/workflows/di.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compileretc:
    name: Vérifier les scripts système
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier la syntaxe des scripts shell
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            echo "Vérification : $script"
            bash -n "$script"
          done < <(
            find rootfs -type f \
              \( -name '*.sh' \
                -o -path 'rootfs/etc/init.d/*' \
                -o -path 'rootfs/gestionnaire de sécurité/s' \) \
              -print0
          )
